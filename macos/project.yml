name: Mailbox
options:
  bundleIdPrefix: com.comeheretosee
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
  configs:
    Release:
      ONLY_ACTIVE_ARCH: NO
      ARCHS: "arm64 x86_64"
targets:
  Mailbox:
    type: application
    platform: macOS
    sources:
      - path: Mailbox
      - path: Shared
    info:
      path: Mailbox/Info.plist
      properties:
        CFBundleDisplayName: Mailbox AI
        CFBundleName: Mailbox AI
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "© ComeHereToSee"
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans, en]
        CFBundleURLTypes:
          - CFBundleURLName: com.comeheretosee.mailbox.ai
            CFBundleURLSchemes: [mailboxai]
          - CFBundleURLName: mailto
            CFBundleURLSchemes: [mailto]
        NSCalendarsFullAccessUsageDescription: Mailbox AI 需要访问日历，以便把会议邀请和邮件中的日程加入日历。
        NSCalendarsWriteOnlyAccessUsageDescription: Mailbox AI 需要写入日历，以便把会议邀请加入日历。
        NSRemindersFullAccessUsageDescription: Mailbox AI 需要访问提醒事项，以便从邮件创建待办提醒。
        NSContactsUsageDescription: Mailbox AI 使用通讯录补全收件人。
        NSUserActivityTypes: [com.comeheretosee.mailbox.ai.message]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSServices:
          - NSMenuItem:
              default: 用 Mailbox AI 发送
            NSMessage: composeWithSelection
            NSPortName: MailboxAI
            NSSendTypes: [NSStringPboardType, public.plain-text, public.file-url, NSFilenamesPboardType]
            NSRequiredContext: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.comeheretosee.mailbox.ai
        PRODUCT_NAME: MailboxAI
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Mailbox/Mailbox.entitlements
        INFOPLIST_KEY_NSHumanReadableCopyright: "© ComeHereToSee"
    dependencies:
      - sdk: AppIntents.framework
      - target: MailboxHelper
        embed: true
        codeSign: false
        copy:
          destination: wrapper
          subpath: Contents/Library/LoginItems
      - target: ShareExtension
        embed: true
        codeSign: false
  MailboxHelper:
    type: application
    platform: macOS
    sources:
      - path: MailboxHelper
      - path: Shared
    info:
      path: MailboxHelper/Info.plist
      properties:
        CFBundleDisplayName: Mailbox AI Helper
        CFBundleName: MailboxAIHelper
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        LSBackgroundOnly: false
        CFBundleURLTypes: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.comeheretosee.mailbox.ai.helper
        PRODUCT_NAME: MailboxAIHelper
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
        SWIFT_OBJC_BRIDGING_HEADER: MailboxHelper/Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/../core/crates/mailcore-ffi/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/Vendor
        OTHER_LDFLAGS: "-lmailcore -framework Security -framework SystemConfiguration -framework CoreFoundation -framework CoreServices"
  ShareExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: ShareExtension
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Mailbox AI
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 20
              NSExtensionActivationSupportsImageWithMaxCount: 20
              NSExtensionActivationSupportsMovieWithMaxCount: 5
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.comeheretosee.mailbox.ai.share
        PRODUCT_NAME: MailboxAIShare
        SKIP_INSTALL: YES
schemes:
  Mailbox:
    build:
      targets:
        Mailbox: all
        MailboxHelper: all
        ShareExtension: all
    run:
      config: Debug
    archive:
      config: Release
